apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: payments
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: "86400000"
    min.insync.replicas: "2"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: inventory
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka
spec:
  partitions: 2
  replicas: 3
  config:
    retention.ms: "86400000"
