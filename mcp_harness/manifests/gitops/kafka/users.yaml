apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: app-payments
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource: {type: topic, name: payments, patternType: literal}
        operations: [Read, Describe, Write]
      - resource: {type: group, name: payments-app, patternType: literal}
        operations: [Read]
