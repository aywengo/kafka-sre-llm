# Sources of the catalogues of real identifiers (M4), beyond the documentation in sources.yaml.
#
# These files are NOT documentation: they never enter the frozen index (built from sources.yaml)
# and never reach work/v3/. scripts/fetch_catalogue_sources.py fetches them into
# raw_catalogue/<name>/ (git-ignored) with shallow, sparse clones, checks that the tag resolves to
# the commit written here, and records the commit and the sha256 of every file in
# raw_catalogue/FETCHED.json. scripts/build_catalogues.py reads raw_catalogue/ and fails loudly
# when a source is missing.
#
# `paths` are sparse-checkout paths (directories or files); `globs` select which of the files
# below them are kept (fnmatch on the repository-relative path, `*` also matches `/`).
# The licence is read from the LICENSE file at the tag and recorded in FETCHED.json.
# Owner's approval of these downloads: 2026-11-18 (all Apache-2.0, pinned to the versions the
# project already uses).

sources:
  # Custom resource definitions (schema of every field of every kind and served version) and the
  # Cluster Operator Deployment and ConfigMap (pod labels, environment variables).
  # Same release as the documentation pin `strimzi` in sources.yaml.
  - name: strimzi-install
    repo: https://github.com/strimzi/strimzi-kafka-operator.git
    ref: 1.3.1
    commit: 555c3e0f07c203911bc3cb7d13ac085bfaa81b50
    paths: [packaging/install/cluster-operator]
    globs:
      - "packaging/install/cluster-operator/04*-Crd-*.yaml"
      - "packaging/install/cluster-operator/050-ConfigMap-*.yaml"
      - "packaging/install/cluster-operator/060-Deployment-*.yaml"
    license: Apache-2.0
    feeds: [strimzi_resources]

  # Source of the command-line tools. bin/*.sh names the main class of each tool
  # (kafka-run-class.sh <class>); the option definitions are in:
  #   tools/                 org.apache.kafka.tools.* (most tools, with the consumer, reassign and
  #                          streams sub-packages that hold the *Options classes)
  #   core/ (3 files)       kafka.admin.ConfigCommand (kafka-configs.sh), kafka.tools.StorageTool
  #                          (kafka-storage.sh), kafka.Kafka (kafka-server-start.sh)
  #   shell/                 org.apache.kafka.shell.MetadataShell (kafka-metadata-shell.sh)
  #   connect/ (cli, mirror) connect-distributed.sh, connect-standalone.sh, connect-mirror-maker.sh
  #   server-common/ util    CommandDefaultOptions / CommandLineUtils (--help, --version, and the
  #                          checks on required and mutually exclusive options)
  #   trogdor/               trogdor.sh (Agent, Coordinator and their clients)
  - name: apache-kafka-tools
    repo: https://github.com/apache/kafka.git
    ref: 4.3.2
    commit: 0a6c96d3b61167f1141df2032f25f10fd6e118fe
    paths:
      - bin
      - tools/src/main/java/org/apache/kafka/tools
      - core/src/main/scala/kafka/admin/ConfigCommand.scala
      - core/src/main/scala/kafka/tools/StorageTool.scala
      - core/src/main/scala/kafka/Kafka.scala
      - shell/src/main/java/org/apache/kafka/shell/MetadataShell.java
      - connect/runtime/src/main/java/org/apache/kafka/connect/cli
      - connect/mirror/src/main/java/org/apache/kafka/connect/mirror/MirrorMaker.java
      - server-common/src/main/java/org/apache/kafka/server/util
      - trogdor/src/main/java/org/apache/kafka/trogdor
    globs:
      - "bin/*.sh"
      - "tools/src/main/java/org/apache/kafka/tools/*.java"
      - "core/src/main/scala/kafka/*"
      - "shell/src/main/java/org/apache/kafka/shell/MetadataShell.java"
      - "connect/runtime/src/main/java/org/apache/kafka/connect/cli/*.java"
      - "connect/mirror/src/main/java/org/apache/kafka/connect/mirror/MirrorMaker.java"
      - "server-common/src/main/java/org/apache/kafka/server/util/CommandDefaultOptions.java"
      - "server-common/src/main/java/org/apache/kafka/server/util/CommandLineUtils.java"
      - "trogdor/src/main/java/org/apache/kafka/trogdor/*.java"
    license: Apache-2.0
    feeds: [kafka_cli]

  # Kubernetes API schema. The documentation pin in sources.yaml is a commit of the website
  # (kubernetes/website, commit 18f8e9f6d2b0, main of 2026-11-11), not a release. Matched by
  # reading hugo.toml at that commit: `latest = "v1.37"`, so the documentation describes
  # Kubernetes 1.37. The newest stable release of the 1.37 line is v1.37.2 (v1.38 has alpha and
  # beta tags only); patch releases do not change the API, so the schema is taken from v1.37.2.
  # A generated kubectl reference does not exist as files in kubernetes/kubernetes at this tag
  # (kubectl is built from cobra code, the reference is generated by a separate repository), so
  # no kubectl list is fetched and the kubectl part of the catalogue stays incomplete.
  - name: kubernetes-api
    repo: https://github.com/kubernetes/kubernetes.git
    ref: v1.37.2
    commit: c50e5395f1ae2d4a2c05f28fdcc38c0916cc1a32
    paths: [api/openapi-spec/swagger.json]
    globs: ["api/openapi-spec/swagger.json"]
    license: Apache-2.0
    feeds: [kubernetes]

  # Argo CD resource definitions. Same release as the documentation pin `argo-cd`.
  - name: argocd-crds
    repo: https://github.com/argoproj/argo-cd.git
    ref: v3.6.1
    commit: 94037c4d4e1af4bd0651d37a179fbd9e347e668c
    paths: [manifests/crds]
    globs: ["manifests/crds/*.yaml"]
    license: Apache-2.0
    feeds: [argocd]

  # Configuration pages of the two previous minor versions (4.2 and 4.1), for defaults that
  # changed. Same repository and commit as the documentation pin `apache-kafka-config`.
  # The checkout in raw/apache-kafka-config holds only content/en/43/generated, so these are
  # fetched here. 4.2 is under content/en/42/generated; the 4.1 pages are under
  # static/41/generated (checked at this commit: content/en/41 has no generated directory).
  - name: kafka-config-pages
    repo: https://github.com/apache/kafka-site.git
    ref: cd727c4dd8664857751a87cd0442e51a3d3aca8f
    commit: cd727c4dd8664857751a87cd0442e51a3d3aca8f
    paths: [content/en/42/generated, static/41/generated]
    globs:
      - "content/en/42/generated/*_config.html"
      - "content/en/42/generated/connect_transforms.html"
      - "content/en/42/generated/connect_predicates.html"
      - "static/41/generated/*_config.html"
      - "static/41/generated/connect_transforms.html"
      - "static/41/generated/connect_predicates.html"
    license: Apache-2.0
    feeds: [kafka_config_history]
