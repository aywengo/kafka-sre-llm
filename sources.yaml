# Documentation sources for the Kafka SRE dataset.
# `ref` pins a release tag. Sources without it follow the default branch.
# Verify each license before publishing a model trained on it, and credit
# the sources in the model card (CC BY requires attribution).

sources:
  - name: apache-kafka
    repo: https://github.com/apache/kafka.git
    # 4.3.2 (commit 0a6c96d3b61167f1141df2032f25f10fd6e118fe) is the newest
    # Kafka that Strimzi 1.3.1 supports (Kafka 4.2.0 to 4.3.2).
    ref: 4.3.2
    paths: [docs]
    globs: ["**/*.html", "**/*.md"]
    license: Apache-2.0

  # Generated configuration reference (actual keys, defaults and descriptions)
  # from the published Kafka 4.3 docs (kafka-site content/en/43), matching
  # the apache-kafka pin above.
  - name: apache-kafka-config
    repo: https://github.com/apache/kafka-site.git
    paths: [content/en/43/generated]
    globs: ["**/*.html"]
    license: Apache-2.0

  - name: strimzi
    repo: https://github.com/strimzi/strimzi-kafka-operator.git
    ref: 1.3.1
    attribute_files:
      - documentation/shared/attributes.adoc
      - documentation/shared/version-dependent-attrs.adoc
    paths: [documentation]
    globs: ["**/*.adoc"]
    license: Apache-2.0

  # Only the parts an SRE running Kafka on Kubernetes needs. Generated API and
  # kubectl reference pages, tutorials and contributor docs are skipped.
  # `exclude` patterns match paths relative to each entry in `paths`.
  - name: kubernetes
    repo: https://github.com/kubernetes/website.git
    paths: [content/en/docs/concepts, content/en/docs/tasks]
    globs: ["**/*.md"]
    exclude:
      - "*/windows/*"
      - "*/extend-kubernetes/*"
      - "*/extend-kubectl/*"
      - "*/tools/*"
      - "*/manage-gpus/*"
    license: CC-BY-4.0

  - name: argo-cd
    repo: https://github.com/argoproj/argo-cd.git
    ref: v3.6.1
    paths: [docs]
    globs: ["**/*.md"]
    exclude:
      - "*/proposals/*"
      - "*/developer-guide/*"
      - "*/commands/*"
      - "*/server-commands/*"
      - "*/snyk/*"
      - "*/assets/*"
      - "*/roadmap.md"
      - "*/bug_triage.md"
      - "*/SUPPORT.md"
    license: Apache-2.0

  # Your own material is usually the most valuable data:
  # runbooks, postmortems, internal wiki exports. Scrub secrets,
  # hostnames and customer data first.
  - name: own-runbooks
    local: ./private/runbooks
    globs: ["**/*.md", "**/*.adoc", "**/*.txt"]
    license: private
